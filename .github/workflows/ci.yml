name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Named jobs rather than one linear run: a PR should show at a glance whether it
# broke style, behaviour, the build, or the shape of the published package.
jobs:
  quality:
    name: Quality
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Formatting (Prettier)
        run: pnpm format:check
      - name: Types (tsc --noEmit)
        run: pnpm typecheck
      - name: Lint (ESLint)
        run: pnpm lint

  tests:
    name: Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Unit + component tests (Vitest, incl. axe and the benchmark)
        run: pnpm test
      # Printed, not asserted on timing: the render counts are already asserted
      # inside the suite, and a shared runner's milliseconds are noise. Having
      # the table in the log makes a regression visible in the PR itself.
      - name: Benchmark table
        run: pnpm bench

  build:
    name: Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build (tsup — ESM + CJS + d.ts)
        run: pnpm build

  pack:
    name: Pack
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # What ends up in the tarball is part of the public API. Checking it here
      # means a stray test file or a missing .d.ts fails a PR, not a release.
      - name: Inspect the publishable tarball
        run: node scripts/verify-package.mjs
