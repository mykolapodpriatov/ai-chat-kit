name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Required for npm provenance: the attestation is signed with this token, so
  # anyone can verify the tarball was built by this workflow from this commit.
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile

      # Publishing an untested build is how a broken package reaches users who
      # cannot un-install it from their lockfile.
      - name: Verify before publishing
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build
          pnpm verify:package

      # Opens (or updates) a "Version Packages" PR when changesets are pending,
      # and publishes when that PR is merged.
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm exec changeset version
          publish: pnpm exec changeset publish
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # changesets/action reads NPM_TOKEN by name to write .npmrc; without
          # it the action falls back to OIDC trusted publishing, which this
          # package is not configured for. NODE_AUTH_TOKEN covers the npm CLI
          # itself.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
